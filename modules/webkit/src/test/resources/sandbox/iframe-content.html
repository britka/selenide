<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>Iframe Inner Page</title>
  <style>
    body { font-family: sans-serif; padding: 12px; margin: 0; background: #f8f9fa; }
  </style>
</head>
<body>
  <h2 id="iframe-heading">Inside Iframe</h2>
  <input id="iframe-input" type="text" value="Initial iframe text">
  <button id="iframe-btn" type="button" onclick="document.getElementById('iframe-status').textContent = 'Clicked: ' + document.getElementById('iframe-input').value">
    Update inside iframe
  </button>
  <p id="iframe-status">Ready</p>
</body>
</html>
